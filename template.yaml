AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: Catlog Data Collection Pipeline

Globals:
  Function:
    Runtime: python3.14
    Timeout: 300
    MemorySize: 512

Parameters:
  
  ## Amazon RDS MySQL Endpoint
  DbHost:
    Type: String
    Description: Amazon RDS MySQL Endpoint

  ## MySQL Port
  DbPort:
    Type: String
    Default: '3306'
    Description: Amazon RDS MySQL Port

  ## MySQL Database 이름
  DbName:
    Type: String
    Default: catlogdb
    Description: Amazon RDS MySQL Database Name

  ## RDS가 자동 생성한 Secrets Manager Secret ARN
  DbSecretArn:
    Type: String
    Description: Amazon RDS Managed Secrets Manager Secret ARN

  ## Load Lambda가 실행될 VPC Subnet
  LoadSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: VPC Subnet ID for Load Lambda

  ## Load Lambda에 연결할 Security Group
  LoadSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security Group ID for Load Lambda

  ## EventBridge Scheduler 활성화 여부
  ScheduleEnabled:
    Type: String
    Default: 'true'

    AllowedValues:
      - 'true'
      - 'false'

    Description: Enable or disable EventBridge Scheduler

  ## EventBridge Scheduler 실행 주기
  ## 기본값: 매일 오전 5시 50분
  ScheduleExpression:
    Type: String
    Default: 'cron(50 18 * * ? *)'
    Description: EventBridge Scheduler cron expression


Resources:

  # ==============================
  # S3
  # ==============================

  DataBucket:
    Type: AWS::S3::Bucket

    Properties:

      ## S3 Public Access 차단
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true


  # ==============================
  # Crawling Lambda
  # ==============================

  CrawlingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: catlog-crawling
      CodeUri: .
      Handler: handlers.crawling_handler.lambda_handler

      Timeout: 900
      MemorySize: 1024

      Environment:
        Variables:
          DATA_DIR: /tmp/data

          DATA_BUCKET:
            Ref: DataBucket

      Policies:
        - S3WritePolicy:
            BucketName:
              Ref: DataBucket


  # ==============================
  # Extract Lambda
  # ==============================

  ExtractFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: catlog-extract
      CodeUri: .
      Handler: handlers.extract_handler.lambda_handler

      Environment:
        Variables:
          DATA_DIR: /tmp/data

          DATA_BUCKET:
            Ref: DataBucket

      Policies:
        - S3ReadPolicy:
            BucketName:
              Ref: DataBucket

        - S3WritePolicy:
            BucketName:
              Ref: DataBucket


  # ==============================
  # Preprocess Lambda
  # ==============================

  PreprocessFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: catlog-preprocess
      CodeUri: .
      Handler: handlers.preprocess_handler.lambda_handler

      Environment:
        Variables:
          DATA_DIR: /tmp/data

          DATA_BUCKET:
            Ref: DataBucket

      Policies:
        - S3ReadPolicy:
            BucketName:
              Ref: DataBucket

        - S3WritePolicy:
            BucketName:
              Ref: DataBucket


  # ==============================
  # Load Lambda
  # ==============================

  LoadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: catlog-load
      CodeUri: .
      Handler: handlers.load_handler.lambda_handler

      Environment:
        Variables:
          DATA_DIR: /tmp/data

          DATA_BUCKET:
            Ref: DataBucket

          DB_HOST:
            Ref: DbHost

          DB_PORT:
            Ref: DbPort

          DB_NAME:
            Ref: DbName

          DB_SECRET_ARN:
            Ref: DbSecretArn

      VpcConfig:
        SecurityGroupIds:
          - Ref: LoadSecurityGroupId

        SubnetIds:
          - Ref: LoadSubnetId

      Policies:
        - S3ReadPolicy:
            BucketName:
              Ref: DataBucket

        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn:
              Ref: DbSecretArn


Outputs:

  DataBucketName:
    Description: Catlog data bucket
    Value:
      Ref: DataBucket