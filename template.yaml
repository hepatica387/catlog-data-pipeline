AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: Catlog Data Collection Pipeline

Globals:
  Function:
    Runtime: python3.12
    Timeout: 300
    MemorySize: 512

Parameters:
  
  ## Amazon RDS MySQL Endpoint
  DbHost:
    Type: String
    Description: Amazon RDS MySQL Endpoint

  ## MySQL Port
  DbPort:
    Type: String
    Default: '3306'
    Description: Amazon RDS MySQL Port

  ## MySQL Database 이름
  DbName:
    Type: String
    Default: catlogdb
    Description: Amazon RDS MySQL Database Name

  ## RDS가 자동 생성한 Secrets Manager Secret ARN
  DbSecretArn:
    Type: String
    Description: Amazon RDS Managed Secrets Manager Secret ARN

  ## Load Lambda가 실행될 VPC Subnet
  LoadSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: VPC Subnet ID for Load Lambda

  ## Load Lambda에 연결할 Security Group
  LoadSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security Group ID for Load Lambda

  ## EventBridge Scheduler 활성화 여부
  ScheduleEnabled:
    Type: String
    Default: 'true'

    AllowedValues:
      - 'true'
      - 'false'

    Description: Enable or disable EventBridge Scheduler

  ## EventBridge Scheduler 실행 주기
  ## 기본값: 매일 오전 5시 50분
  ScheduleExpression:
    Type: String
    Default: 'cron(50 18 * * ? *)'
    Description: EventBridge Scheduler cron expression


Resources:

  # ==============================
  # S3
  # ==============================

  DataBucket:
    Type: AWS::S3::Bucket

    Properties:

      ## S3 Public Access 차단
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true


  # ==============================
  # Crawling Lambda
  # ==============================

  CrawlingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: catlog-crawling
      CodeUri: .
      Handler: handlers.crawling_handler.lambda_handler

      Timeout: 900
      MemorySize: 1024

      Environment:
        Variables:
          DATA_DIR: /tmp/data

          DATA_BUCKET_NAME: !Ref DataBucket

      Policies:
        - S3WritePolicy:
            BucketName: !Ref DataBucket


  # ==============================
  # Extract Lambda
  # ==============================

  ExtractFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: catlog-extract
      CodeUri: .
      Handler: handlers.extract_handler.lambda_handler

      Environment:
        Variables:
          DATA_DIR: /tmp/data

          DATA_BUCKET_NAME: !Ref DataBucket

      Policies:
         ## Raw HTML 다운로드를 위한 S3 읽기 권한
        - S3ReadPolicy:
            BucketName: !Ref DataBucket

        ## Interim CSV 업로드를 위한 S3 쓰기 권한
        - S3WritePolicy:
            BucketName: !Ref DataBucket


  # ==============================
  # Preprocess Lambda
  # ==============================

  PreprocessFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: catlog-preprocess
      CodeUri: .
      Handler: handlers.preprocess_handler.lambda_handler

      Environment:
        Variables:
          DATA_DIR: /tmp/data

          DATA_BUCKET_NAME: !Ref DataBucket

      Policies:
        ## Interim CSV 다운로드를 위한 S3 읽기 권한
        - S3ReadPolicy:
            BucketName: !Ref DataBucket

        ## Processed CSV 업로드를 위한 S3 쓰기 권한
        - S3WritePolicy:
            BucketName: !Ref DataBucket


  # ==============================
  # Load Lambda
  # ==============================

  LoadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: catlog-load
      CodeUri: .
      Handler: handlers.load_handler.lambda_handler

      Environment:
        Variables:
          DATA_DIR: /tmp/data

           ## Data Pipeline S3 Bucket 이름
          DATA_BUCKET_NAME: !Ref DataBucket

          ## Amazon RDS MySQL Endpoint
          DB_HOST: !Ref DbHost

          ## Amazon RDS MySQL Port
          DB_PORT: !Ref DbPort

          ## MySQL Database 이름
          DB_NAME: !Ref DbName

          ## RDS가 관리하는 Secrets Manager Secret ARN
          DB_SECRET_ARN: !Ref DbSecretArn
          
      ## Load Lambda를 RDS와 동일 VPC에 연결
      VpcConfig:

      ## Load Lambda가 사용할 Security Group
        SecurityGroupIds:
          - !Ref LoadSecurityGroupId

        ## Load Lambda가 사용할 Subnet
        SubnetIds:
          - !Ref LoadSubnetId

      Policies:

      ## VPC 안에서 Lambda ENI를 생성/관리하기 위한 AWS 관리형 정책
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

         ## Processed CSV 다운로드를 위한 S3 읽기 권한
        - S3ReadPolicy:
            BucketName: !Ref DataBucket

        ## RDS 관리형 Secret 조회를 위한 Secrets Manager 권한
        - Statement:

            - Sid: ReadDatabaseSecret
              Effect: Allow

              Action:
                - secretsmanager:GetSecretValue

              Resource:
                - !Ref DbSecretArn


Outputs:

  DataBucketName:
    Description: Catlog data bucket
    Value: !Ref DataBucket

   ## Crawling Lambda 물리적 함수명
  CrawlingFunctionName:
    Description: Crawling Lambda Function Name
    Value: !Ref CrawlingFunction

  ## Crawling Lambda ARN
  CrawlingFunctionArn:
    Description: Crawling Lambda Function ARN
    Value: !GetAtt CrawlingFunction.Arn

  ## =========================================================
  ## Extract Lambda
  ## =========================================================

  ## Extract Lambda 물리적 함수명
  ExtractFunctionName:
    Description: Extract Lambda Function Name
    Value: !Ref ExtractFunction

  ## Extract Lambda ARN
  ExtractFunctionArn:
    Description: Extract Lambda Function ARN
    Value: !GetAtt ExtractFunction.Arn

  ## =========================================================
  ## Preprocess Lambda
  ## =========================================================

  ## Preprocess Lambda 물리적 함수명
  PreprocessFunctionName:
    Description: Preprocess Lambda Function Name
    Value: !Ref PreprocessFunction

  ## Preprocess Lambda ARN
  PreprocessFunctionArn:
    Description: Preprocess Lambda Function ARN
    Value: !GetAtt PreprocessFunction.Arn

  ## =========================================================
  ## Load Lambda
  ## =========================================================

  ## Load Lambda 물리적 함수명
  LoadFunctionName:
    Description: Load Lambda Function Name
    Value: !Ref LoadFunction

  ## Load Lambda ARN
  LoadFunctionArn:
    Description: Load Lambda Function ARN
    Value: !GetAtt LoadFunction.Arn

  